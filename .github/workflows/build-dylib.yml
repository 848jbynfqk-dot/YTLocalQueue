name: Build YTLocalQueue
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Get the tweak source code
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install make ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS 16.5 SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Download YouTube headers
        run: git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git Headers/YouTubeHeader

      - name: Build
        run: gmake FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload the dylib
        uses: actions/upload-artifact@v4
        with:
          name: YTLocalQueue
          path: .theos/obj/**/*.dylib
          if-no-files-found: error
